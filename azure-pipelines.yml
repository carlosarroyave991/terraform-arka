# azure-pipelines.yml (repo infra-aws)
# Pipeline para despliegue automático de infraestructura AWS con Terraform

trigger:
  branches:
    include:
      - clean-main
  paths:
    include:
      - '**/*.tf'

pr:
  branches:
    include:
      - main

variables:
  - name: AWS_REGION
    value: us-east-1
  - name: TF_BACKEND_BUCKET
    value: my-terraform-state-bucket
  - name: TF_LOCK_TABLE
    value: terraform-locks
  - group: dev-terraform

stages:
  - stage: Terraform
    displayName: 'Terraform Init & Apply'
    jobs:
      - job: Apply
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # Clonar el repo de infra
          - checkout: self

          # Autenticarse en AWS
          - task: AWSShellScript@1
            inputs:
              awsCredentials: 'aws-terraform-ecr'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                aws sts get-caller-identity
                echo "AWS authentication successful"

          # Instalar Terraform
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.5.0'

          # Mostrar variables disponibles
          - script: |
              echo "Variables disponibles:"
              echo "AWS_REGION: $(AWS_REGION)"
              echo "aws_account_id: $(aws_account_id)"
              echo "environment: $(environment)"
              echo "db_username: $(db_username)"
            displayName: 'Debug Variables'
            workingDirectory: .

          # Crear archivo terraform.tfvars
          - script: |
              cat <<EOF > terraform.tfvars
              aws_region       = "$(AWS_REGION)"
              aws_account_id   = "$(aws_account_id)"
              environment      = "$(environment)"
              db_username      = "$(db_username)"
              db_password      = "$(db_password)"
              db_name          = "$(db_name)"
              db_schema        = "$(db_schema)"
              jwt_secret_key   = "$(jwt_secret_key)"
              sendgrid_api_key = "$(sendgrid_api_key)"
              EOF
            displayName: 'Create terraform.tfvars'
            workingDirectory: .

          # Terraform init
          - script: |
              terraform init \
                -backend-config="bucket=$(TF_BACKEND_BUCKET)" \
                -backend-config="key=infra.tfstate" \
                -backend-config="region=$(AWS_REGION)" \
                -backend-config="dynamodb_table=$(TF_LOCK_TABLE)"
            displayName: 'Terraform Init'
            workingDirectory: .

          # Terraform plan
          - script: |
              terraform plan -out=tfplan
            displayName: 'Terraform Plan'
            workingDirectory: .

          # Terraform apply
          - script: |
              terraform apply -auto-approve tfplan
            displayName: 'Terraform Apply'
            workingDirectory: .