# azure-pipelines.yml (repo infra-aws)
# Pipeline para despliegue automático de infraestructura AWS con Terraform

trigger:
  branches:
    include:
      - clean-main
  paths:
    include:
      - '**/*.tf'

pr:
  branches:
    include:
      - main

variables:
  - name: AWS_REGION
    value: us-east-1
  - name: TF_BACKEND_BUCKET
    value: my-terraform-state-bucket
  - name: TF_LOCK_TABLE
    value: terraform-locks
  - group: dev-terraform

stages:
  - stage: Terraform
    displayName: 'Terraform Init & Apply'
    jobs:
      - job: Apply
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # Clonar el repo de infra
          - checkout: self

          # Autenticarse en AWS
          - task: AWSShellScript@1
            inputs:
              awsCredentials: 'aws-terraform-ecr'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                aws sts get-caller-identity
                echo "AWS authentication successful"

          # Instalar Terraform
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.5.0'

          # Crear archivo terraform.tfvars
          - script: |
              # Creamos el tfvars con variables del grupo
              echo "aws_region       = \"$(AWS_REGION)\"" > terraform.tfvars
              echo "aws_account_id   = \"$(aws_account_id)\"" >> terraform.tfvars
              echo "environment      = \"$(environment)\"" >> terraform.tfvars
              echo "db_username      = \"$(db_username)\"" >> terraform.tfvars
              echo "db_password      = \"$(db_password)\"" >> terraform.tfvars
              echo "db_name          = \"$(db_name)\"" >> terraform.tfvars
              echo "db_schema        = \"$(db_schema)\"" >> terraform.tfvars
              echo "jwt_secret_key   = \"$(jwt_secret_key)\"" >> terraform.tfvars
              echo "sendgrid_api_key = \"$(sendgrid_api_key)\"" >> terraform.tfvars
            displayName: 'Create terraform.tfvars'
            workingDirectory: .

          # Terraform init
          - script: |
              terraform init \
                -backend-config="bucket=$(TF_BACKEND_BUCKET)" \
                -backend-config="key=infra.tfstate" \
                -backend-config="region=$(AWS_REGION)" \
                -backend-config="dynamodb_table=$(TF_LOCK_TABLE)"
            displayName: 'Terraform Init'
            workingDirectory: .

          # Terraform plan
          - script: |
              terraform plan -out=tfplan
            displayName: 'Terraform Plan'
            workingDirectory: .

          # Terraform apply
          - script: |
              terraform apply -auto-approve tfplan
            displayName: 'Terraform Apply'
            workingDirectory: .