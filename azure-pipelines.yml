# azure-pipelines.yml (repo infra-aws)
# Pipeline para despliegue automático de infraestructura AWS con Terraform

trigger:
  branches:
    include:
      - clean-main
  paths:
    include:
      - '**/*.tf'

pr:
  branches:
    include:
      - main

variables:
  AWS_REGION: us-east-1
  TF_BACKEND_BUCKET: my-terraform-state-bucket
  TF_LOCK_TABLE: terraform-locks
variable groups:
  - group: dev-terraform

stages:
  - stage: Terraform
    displayName: 'Terraform Init & Apply'
    jobs:
      - job: Apply
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # Clonar el repo de infra
          - checkout: self

          # Autenticarse en AWS
          - task: AWSShellScript@1
            inputs:
              awsCredentials: 'aws-terraform-ecr'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                aws sts get-caller-identity
                echo "AWS authentication successful"

          # Instalar Terraform
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.5.0'

          # Crear archivo terraform.tfvars
          - script: |
              echo "aws_region = \"$(AWS_REGION)\"" >> terraform.tfvars
              echo "aws_account_id = \"$(AWS_ACCOUNT_ID)\"" >> terraform.tfvars
              echo "environment = \"dev\"" >> terraform.tfvars
              echo "db_username = \"$(DB_USERNAME)\"" >> terraform.tfvars
              echo "db_password = \"$(DB_PASSWORD)\"" >> terraform.tfvars
              echo "db_name = \"$(DB_NAME)\"" >> terraform.tfvars
              echo "db_schema = \"$(DB_SCHEMA)\"" >> terraform.tfvars
              echo "jwt_secret_key = \"$(JWT_SECRET_KEY)\"" >> terraform.tfvars
              echo "sendgrid_api_key = \"$(SENDGRID_API_KEY)\"" >> terraform.tfvars
            displayName: 'Create terraform.tfvars'
            workingDirectory: .

          # Terraform init
          - script: |
              terraform init \
                -backend-config="bucket=$(TF_BACKEND_BUCKET)" \
                -backend-config="key=infra.tfstate" \
                -backend-config="region=$(AWS_REGION)" \
                -backend-config="dynamodb_table=$(TF_LOCK_TABLE)"
            displayName: 'Terraform Init'
            workingDirectory: .

          # Terraform plan
          - script: |
              terraform plan -out=tfplan
            displayName: 'Terraform Plan'
            workingDirectory: .

          # Terraform apply
          - script: |
              terraform apply -auto-approve tfplan
            displayName: 'Terraform Apply'
            workingDirectory: .
